<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таб-бар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Основная навигация" style="width: 390px; height: 96px; box-sizing: border-box; padding: 8px 12px 26px; background: {{bg}}; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid {{line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; font-family: Onest, 'Segoe UI', Roboto, system-ui, sans-serif; color: {{idle}}">
  <a href="Main.dc.html" aria-current="{{curHome}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{cHome}}; font-size: 11px; font-weight: 600">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>
    Главная
  </a>
  <a href="Transactions.dc.html" aria-current="{{curOps}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{cOps}}; font-size: 11px; font-weight: 600">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="3.5" cy="6" r="1"></circle><circle cx="3.5" cy="12" r="1"></circle><circle cx="3.5" cy="18" r="1"></circle></svg>
    Операции
  </a>
  <div style="display: flex; justify-content: center">
    <a href="QuickAdd.dc.html" aria-label="Добавить операцию" style="width: 60px; height: 60px; margin-top: -30px; border-radius: 22px; background: linear-gradient(140deg, #A6D987 0%, #85BB65 45%, #4E9A3A 100%); box-shadow: 0 14px 30px -10px rgba(133,187,101,.8), inset 0 1px 0 rgba(255,255,255,.45); display: grid; place-items: center; color: #0B0D12">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>
  <a href="Budget.dc.html" aria-current="{{curBudget}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{cBudget}}; font-size: 11px; font-weight: 600">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>
    Бюджет
  </a>
  <a href="Analytics.dc.html" aria-current="{{curAn}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{cAn}}; font-size: 11px; font-weight: 600">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"></path></svg>
    Аналитика
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","ops","budget","analytics","none"],"default":"home"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const light = (this.props.theme ?? 'dark') === 'light';
    const on = light ? '#4A3AD6' : '#B4AAFF';
    const idle = light ? '#5B6474' : '#7D8698';
    const c = (k) => (a === k ? on : idle);
    const cur = (k) => (a === k ? 'page' : 'false');
    return {
      bg: light ? 'rgba(255,255,255,.88)' : 'rgba(11,13,18,.88)',
      line: light ? '#E3E6E0' : '#1F2432',
      idle,
      cHome: c('home'), cOps: c('ops'), cBudget: c('budget'), cAn: c('analytics'),
      curHome: cur('home'), curOps: cur('ops'), curBudget: cur('budget'), curAn: cur('analytics')
    };
  }
}
</script>
</body>
</html>
