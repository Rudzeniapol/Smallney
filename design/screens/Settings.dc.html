<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080C}
a{color:#B4AAFF}a:hover{color:#D4CEFF}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.28s}.d5{animation-delay:.36s}
.knob{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.row{transition:background .2s ease}.row:hover{background:#181D28}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; box-sizing: border-box; background: #0B0D12; font-family: Onest, 'Segoe UI', Roboto, system-ui, sans-serif; color: #EEF1F6">
  <div style="padding: 48px 20px 40px; display: flex; flex-direction: column; gap: 20px">

    <header class="rise" style="display: flex; align-items: center; gap: 12px">
      <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; background: #141821; border: 1px solid #232938; display: grid; place-items: center; color: #EEF1F6; flex: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-family: Unbounded, system-ui, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Настройки</h1>
    </header>

    <section class="rise d1" aria-label="Профиль" style="border-radius: 24px; padding: 16px; background: linear-gradient(140deg, rgba(106,90,249,.25), rgba(133,187,101,.1)); border: 1px solid #2E3550; display: flex; align-items: center; gap: 14px">
      <div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 17px; background: linear-gradient(135deg, #85BB65, #3E8E5A); display: grid; place-items: center; font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 20px; color: #0B0D12">Д</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 16px; font-weight: 600">you@example.com</span>
        <span style="font-size: 12px; color: #C7CDD8; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #85BB65"></span>Синхронизировано · 2 мин назад</span>
      </div>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section class="rise d2" aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #98A1B3">{{g.title}}</h2>
        <div style="border-radius: 20px; background: #141821; border: 1px solid #232938; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
            <button class="row" style="width: 100%; min-height: 54px; padding: 0 14px; border: 0; border-bottom: 1px solid {{r.sep}}; background: transparent; color: #EEF1F6; display: flex; align-items: center; gap: 12px; font: 400 15px Onest, system-ui, sans-serif; text-align: left; cursor: pointer">
              <span style="width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center; background: {{r.tileBg}}; color: {{r.col}}">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
              </span>
              <span style="flex: 1">{{r.label}}</span>
              <span style="color: #98A1B3; font-size: 14px">{{r.value}}</span>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <section class="rise d3" aria-labelledby="look-h" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="look-h" style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #98A1B3">Оформление</h2>
      <div style="border-radius: 20px; background: #141821; border: 1px solid #232938; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
        <div role="radiogroup" aria-label="Тема" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #0F1218">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="min-height: 40px; border: 0; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font: 600 13px Onest, system-ui, sans-serif; cursor: pointer">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; font-size: 15px"><span>Язык</span><span style="color: #98A1B3">Русский</span></div>
      </div>
    </section>

    <section class="rise d4" aria-labelledby="nt-h" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="nt-h" style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #98A1B3">Уведомления на устройстве</h2>
      <div style="border-radius: 20px; background: #141821; border: 1px solid #232938; overflow: hidden">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
          <div style="min-height: 60px; padding: 8px 14px; border-bottom: 1px solid {{t.sep}}; display: flex; align-items: center; gap: 12px">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{t.label}}</span><span style="font-size: 12px; color: #98A1B3">{{t.sub}}</span></span>
            <button role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="width: 52px; height: 32px; flex: none; border: 0; border-radius: 99px; padding: 3px; background: {{t.bg}}; cursor: pointer; display: flex; transition: background .25s ease">
              <span class="knob" style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transform: {{t.tx}}"></span>
            </button>
          </div>
        </sc-for>
      </div>
    </section>

    <button class="rise d5" style="min-height: 52px; border-radius: 18px; border: 1px solid rgba(255,107,127,.35); background: rgba(255,107,127,.08); color: #FF8E9D; font: 600 15px Onest, system-ui, sans-serif; cursor: pointer">Выйти из аккаунта</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'dark', pay: true, lim: true };
  }
  renderVals() {
    const s = this.state;
    const mk = (rows) => rows.map(([label, value, col, d], i) => ({ label, value, col, d, tileBg: col + '24', sep: i === rows.length - 1 ? 'transparent' : '#1F2432' }));
    const groups = [
      { title: 'Финансы', rows: mk([
        ['Базовая валюта', 'BYN', '#85BB65', 'M12 3v18M16 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H8'],
        ['Начало месяца', '5-е число', '#9C90FF', 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4'],
        ['Счёт по умолчанию', 'Зарплатная', '#5CC8FF', 'M3 5h18v14H3zM3 10h18'],
        ['Порог тревоги', '1 000 Br', '#FF8E9D', 'M12 3 2 20h20zM12 10v4M12 17h.01']
      ])},
      { title: 'Данные', rows: mk([
        ['Категории', '24', '#F2C14E', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
        ['Правила категоризации', '12', '#C58BFF', 'M4 6h16M7 12h10M10 18h4'],
        ['Импорт из CSV', '', '#85BB65', 'M12 3v12M7 10l5 5 5-5M4 19h16'],
        ['Экспорт данных', 'JSON · CSV', '#5CC8FF', 'M12 15V3M7 8l5-5 5 5M4 19h16']
      ])}
    ];
    const themes = [['system', 'Системная'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, label]) => ({
      label, sel: s.theme === k ? 'true' : 'false',
      bg: s.theme === k ? '#6A5AF9' : 'transparent', fg: s.theme === k ? '#FFFFFF' : '#98A1B3',
      pick: () => this.setState({ theme: k })
    }));
    const T = [['pay', 'Регулярные платежи', 'В день платежа'], ['lim', 'Лимиты бюджета', 'При 80% и 100% по категории']];
    const toggles = T.map(([k, label, sub], i) => ({
      label, sub, aria: s[k] ? 'true' : 'false',
      bg: s[k] ? '#85BB65' : '#343B4E', tx: s[k] ? 'translateX(20px)' : 'translateX(0)',
      sep: i === T.length - 1 ? 'transparent' : '#1F2432',
      flip: () => this.setState({ [k]: !s[k] })
    }));
    return { groups, themes, toggles };
  }
}
</script>
</body>
</html>
